[extension]
id = "xs2-novel-flywheel"
name = "XS2 Novel Flywheel"
version = "0.1.14"
api_version = "1"
description = "Bishu-compatible novel production workflows with selectable reference learning."
dependencies = []
capabilities = [
  "workflow.runtime",
  "resources.agents",
  "resources.prompts",
  "resources.skills",
  "resources.workflows",
  "resources.scripts",
]

[resource_namespace]
prefix = "xs2-novel-flywheel"

[resources]
agents = "resources/agents.json"
prompts = "resources/prompts.json"
skills = "resources/skills.json"
skill_bundles = "resources/skill-bundles"
workflows = "resources/workflows"
script_libraries = "resources/script-library"


