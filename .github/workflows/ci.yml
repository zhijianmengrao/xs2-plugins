name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Public Core tag or commit used to test and build the registry"
        type: string
        default: main
      publish_registry:
        description: "Publish verified packages and update the stable R2 registry (main only)"
        type: boolean
        default: false

permissions:
  contents: read

# 本仓是 fork（origin = zhijianmengrao/xs2-plugins）。Core 仓须显式指定：fork 的
# `github.repository_owner` 下没有 DeterminFlow 仓，直接用 owner 拼会 checkout 失败
# （R42 实测：bishu-novel/public-api 两个 job 在 checkout 阶段就 failure）。
# 需要指向别的 Core 时在仓库变量 CORE_REPOSITORY 里覆盖（owner/repo 形式）。
jobs:
  xs2-novel-flywheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPOSITORY || 'alikon-art/DeterminFlow' }}
          ref: ${{ inputs.core_ref || 'main' }}
          path: determinflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: determinflow/requirements-dev.lock
      - run: python -m pip install -r determinflow/requirements-dev.lock
      - name: Test Plugin
        env:
          DETERMINFLOW_CORE_ROOT: ${{ github.workspace }}/determinflow
          PYTHONPATH: ${{ github.workspace }}/determinflow
        run: python -m pytest -q plugins/xs2-novel-flywheel/tests
      - name: Validate Workflows
        run: >-
          python determinflow/src/core/defaults/skills/workflow-guide/scripts/validate_definition.py
          plugins/xs2-novel-flywheel/resources/workflows

  publish-registry:
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_registry)) &&
      github.ref == 'refs/heads/main' &&
      vars.R2_DISTRIBUTION_ENABLED == 'true'
    needs:
      - xs2-novel-flywheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPOSITORY || 'alikon-art/DeterminFlow' }}
          ref: ${{ inputs.core_ref || 'main' }}
          path: determinflow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: determinflow/requirements.lock
      - run: python -m pip install -r determinflow/requirements.lock
      - name: Build signed registry
        working-directory: determinflow
        env:
          PLUGIN_REGISTRY_SIGNING_KEY: ${{ secrets.PLUGIN_REGISTRY_SIGNING_KEY }}
        # source-url 走本仓（fork）而非硬编码上游：签名登记的规范源必须与客户端
        # 实际拉取的源一致，否则验签主体与内容来源不符。
        run: >-
          python -m src.plugin_system.registry_release build
          --repository "$GITHUB_WORKSPACE"
          --source-url "https://github.com/${{ github.repository }}.git"
          --ref "$GITHUB_SHA"
          --output "$GITHUB_WORKSPACE/registry-output"
          --public-base-url "https://downloads.determinflow.com/plugins/v1"
      - name: Publish verified registry to R2
        working-directory: determinflow
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
        run: |
          aws --version
          python -m src.plugin_system.registry_release publish \
            --registry-dir "$GITHUB_WORKSPACE/registry-output" \
            --prefix "plugins/v1" \
            --bucket "$R2_BUCKET" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --public-base-url "https://downloads.determinflow.com"
